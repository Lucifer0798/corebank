# Prometheus, so the cluster has the alerting the compose stack has. Without it, every metric the app
# and insights export went unread here: the ledger check, a stuck outbox, search falling behind,
# failing background tasks, insights stopping.
#
# Its config is the compose stack's own, not a copy: observability/prometheus.yml and
# observability/alerts.yml, loaded into the prometheus-config ConfigMap by deploy.sh and Terraform
# (kustomize refuses files outside k8s/; see kustomization.yaml). The scrape targets need no change:
# the Services are named app and insights here too, so "app:8080" and "insights:8000" resolve the
# same way, and the rules' job="corebank" and job="insights" match.
#
# Its data is an emptyDir: history goes with the pod. Right for a local kind cluster; a real one
# would want a PersistentVolumeClaim and a retention setting.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: corebank
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          # The version compose runs and CI's promtool checks the rules with.
          image: prom/prometheus:v3.14.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: 9090 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { memory: 128Mi, cpu: 50m }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: corebank
spec:
  selector: { app: prometheus }
  ports:
    - port: 9090
