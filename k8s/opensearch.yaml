# Same local-dev posture as compose.yaml's opensearch service: security plugin disabled entirely,
# single node. Not something to carry into any environment beyond a laptop or a throwaway kind
# cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: corebank
spec:
  replicas: 1
  selector:
    matchLabels: { app: opensearch }
  template:
    metadata:
      labels: { app: opensearch }
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.19.1
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: corebank
spec:
  selector: { app: opensearch }
  ports:
    - port: 9200
