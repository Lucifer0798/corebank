# Plain-text local-dev credentials, matching compose.yaml's own defaults exactly (corebank/corebank,
# admin/admin). Fine for a throwaway local kind cluster; not intended as a template for a real
# cluster, which would pull these from a secret manager instead of a committed file.
apiVersion: v1
kind: Secret
metadata:
  name: corebank-secrets
  namespace: corebank
type: Opaque
stringData:
  postgres-password: corebank
  keycloak-admin-password: admin
