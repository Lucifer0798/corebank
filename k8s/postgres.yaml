apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: corebank
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: corebank
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: corebank
            - name: POSTGRES_USER
              value: corebank
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: corebank-secrets, key: postgres-password }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "corebank", "-d", "corebank"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: corebank
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
