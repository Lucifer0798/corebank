spring:
  datasource:
    url: jdbc:h2:mem:corebank-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

corebank:
  security:
    jwt:
      secret: test-secret-value-that-is-long-enough-1234567890
      issuer: corebank-lite-test
      access-token-ttl: PT30M
    bootstrap-admin-password: BootstrapTest#2025
  ledger:
    cash-account-number: GL0000000001
    suspense-account-number: GL0000000002
  account:
    number-prefix: "1001"

logging:
  level:
    com.corebank: DEBUG
