spring:
  datasource:
    url: jdbc:h2:mem:corebank-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Never actually called: tests inject a fake Jwt principal directly via
          # SecurityMockMvcRequestPostProcessors.jwt(), bypassing the decoder. Both properties
          # are set anyway so the JwtDecoder bean itself can build without a network call.
          issuer-uri: http://localhost:8081/realms/corebank-test
          jwk-set-uri: http://localhost:8081/realms/corebank-test/protocol/openid-connect/certs
  kafka:
    producer:
      # Matches main's application.yml explicitly rather than relying on this being absent and
      # falling back to some Boot default: OutboxRelay's KafkaTemplate<String,String> needs a
      # value-serializer configured at all, or the *first send attempt* (not context startup,
      # since producer factories are lazy) throws ConfigException: Missing required configuration
      # "value.serializer" -- caught by OutboxRelay's own try/catch, so this suite would not fail
      # loudly on it, just retry forever and log a warning every tick.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

corebank:
  ledger:
    cash-account-number: GL0000000001
    suspense-account-number: GL0000000002
  account:
    number-prefix: "1001"
  web:
    allowed-origins: http://localhost:5173
  search:
    # Never actually reachable in this mocked-JWT/H2 suite -- OpenSearchClient construction is
    # lazy (no network call), and every write to it is fire-and-forget and logs-and-swallows on
    # failure, so this only needs to be a syntactically valid URI to satisfy CoreBankProperties'
    # @NotBlank validation at context startup.
    opensearch-uri: http://localhost:9200
  outbox:
    batch-size: 50
    send-timeout: 3s
    relay-interval: 2s
    # Off by default in this suite: it deliberately never runs a real Kafka broker, so every
    # unpublished row a test creates would otherwise retry every tick against an unreachable
    # localhost:9092 for the rest of the JVM's life, each attempt blocking up to send-timeout --
    # one test paid 22 seconds for exactly this before it was disabled here. The write path (an
    # outbox row commits atomically with its transaction) is still fully exercised; only the
    # "actually reach a broker" half needs a broker, which this suite structurally doesn't have.
    # CoreBankTestcontainersIT overrides this back to true, since it runs against a real one.
    relay-enabled: false

spring.grpc:
  server:
    # Port 0, not the real 9091: this suite doesn't exercise gRPC (it has no real Keycloak to
    # mint a token the interceptor would accept), but the server still starts with the context,
    # and a fixed port would collide with a locally running app or with a second test context.
    # CoreBankTestcontainersIT pins its own port instead, since it does call the gRPC surface.
    port: 0

logging:
  level:
    com.corebank: DEBUG
