spring:
  application:
    name: corebank
  datasource:
    url: ${COREBANK_DB_URL:jdbc:postgresql://localhost:5432/corebank}
    username: ${COREBANK_DB_USER:corebank}
    password: ${COREBANK_DB_PASSWORD:corebank}
    hikari:
      pool-name: corebank-pool
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Both are set deliberately. jwk-set-uri lets the app start without Keycloak being
          # reachable yet -- only issuer-uri alone forces an eager discovery-document fetch at
          # startup. With both present, Spring validates the `iss` claim against issuer-uri as a
          # plain string comparison and fetches signing keys lazily from jwk-set-uri.
          issuer-uri: ${COREBANK_OIDC_ISSUER_URI:http://localhost:8081/realms/corebank}
          jwk-set-uri: ${COREBANK_OIDC_JWK_SET_URI:http://localhost:8081/realms/corebank/protocol/openid-connect/certs}
  data:
    redis:
      host: ${COREBANK_REDIS_HOST:localhost}
      port: ${COREBANK_REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 1s
  kafka:
    bootstrap-servers: ${COREBANK_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      # max.block.ms is set in KafkaProducerConfig instead of here: the equivalent YAML property
      # did not reliably take effect.
    consumer:
      group-id: corebank-app
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: com.corebank.transaction.messaging.TransactionPostedEvent
        spring.json.trusted.packages: com.corebank.transaction.messaging

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    tracing:
      endpoint: ${COREBANK_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
    metrics:
      export:
        # Metrics are pulled by Prometheus scraping /actuator/prometheus instead; without this,
        # the opentelemetry starter also auto-enables a *second*, unconfigured push-based OTLP
        # metrics exporter that just fails against localhost every minute.
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          # Same value as management.otlp.tracing.endpoint above, under the other property
          # namespace spring-boot-opentelemetry also recognizes -- set both until it's clear
          # which one this Boot version actually binds the exporter to.
          endpoint: ${COREBANK_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    sampling:
      # Every request traced. Fine at this traffic volume; a real production
      # deployment would sample a fraction instead.
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    oauth:
      client-id: corebank-web
      use-pkce-with-authorization-code-grant: true
  api-docs:
    path: /v3/api-docs

corebank:
  ledger:
    # Internal general-ledger account used as the contra-leg for cash in/out.
    cash-account-number: GL0000000001
    suspense-account-number: GL0000000002
  account:
    # Numeric prefix for generated customer account numbers.
    number-prefix: "1001"
  web:
    # Comma-separated list of origins the frontend is served from, for CORS.
    allowed-origins: ${COREBANK_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.corebank: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:corebank;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
logging:
  level:
    com.corebank: DEBUG
