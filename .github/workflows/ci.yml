name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Belt and suspenders alongside the git executable-bit fix on mvnw itself: this repo was
      # created on Windows, which does not track the POSIX executable bit, so it is easy for a
      # future regenerated mvnw to silently lose it again.
      - run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B verify

      # Excluded from the default test/verify run by Surefire's *IT naming convention (no
      # failsafe plugin is configured) so the everyday loop stays fast; run explicitly here so
      # it's still exercised on every push, per this project's practice of verifying against real
      # running infrastructure rather than trusting config by inspection. GitHub's ubuntu-latest
      # runners ship Docker, so Testcontainers works with no extra setup.
      - name: Real-infrastructure integration tests (Testcontainers)
        run: ./mvnw -B test -Dtest=CoreBankTestcontainersIT

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      # Optional: only runs when a SONAR_TOKEN secret has been added (Settings > Secrets and
      # variables > Actions), which needs a SonarCloud account this workflow cannot create for
      # you. See docs/LOCAL_SETUP.md for a self-hosted alternative that needs no account at all.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar -Dsonar.host.url=https://sonarcloud.io

  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  insights:
    name: Spending insights (Python) build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: insights
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: insights/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # test_store.py spins up a real Postgres via testcontainers-python -- the same
      # "verify against real infrastructure" practice as the Java Testcontainers step above.
      # ubuntu-latest ships Docker, so this needs no extra setup here either.
      - name: Test
        run: python -m pytest tests/ -q

  docker:
    name: Docker image build and scan
    runs-on: ubuntu-latest
    needs: [backend, insights]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: corebank-app
            context: .
          - image: corebank-insights
            context: insights
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t ${{ matrix.image }}:ci ${{ matrix.context }}

      # Reports vulnerabilities without failing the build: most findings at this severity land
      # in base-image OS packages outside this project's control, so treating them as a hard
      # gate would block merges over CVEs nobody here can fix. Tighten exit-code to 1 once the
      # base image and dependency set are being actively kept current against advisories.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
