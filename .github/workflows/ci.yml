name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      # Optional: only runs when a SONAR_TOKEN secret has been added (Settings > Secrets and
      # variables > Actions), which needs a SonarCloud account this workflow cannot create for
      # you. See docs/LOCAL_SETUP.md for a self-hosted alternative that needs no account at all.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar -Dsonar.host.url=https://sonarcloud.io

  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  docker:
    name: Docker image build and scan
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t corebank-app:ci .

      # Reports vulnerabilities without failing the build: most findings at this severity land
      # in base-image OS packages outside this project's control, so treating them as a hard
      # gate would block merges over CVEs nobody here can fix. Tighten exit-code to 1 once the
      # base image and dependency set are being actively kept current against advisories.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: corebank-app:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
