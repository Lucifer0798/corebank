name: corebank

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: corebank
      POSTGRES_USER: corebank
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corebank}
    ports:
      # Published on 5433 by default so this does not collide with a PostgreSQL already
      # installed on the host. The app container reaches the database at postgres:5432
      # over the compose network regardless of what is published here.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # The application waits for this, so it must report readiness rather than liveness.
      test: ["CMD-SHELL", "pg_isready -U corebank -d corebank"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Fixed so every token's `iss` claim is this one value, regardless of whether the request
      # that obtained it came from the host (localhost:8081) or another container (keycloak:8080).
      # The application is configured to match on this same string -- see COREBANK_OIDC_ISSUER_URI.
      KC_HOSTNAME: http://localhost:8081
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/corebank-realm.json:/opt/keycloak/data/import/corebank-realm.json:ro
    ports:
      - "8081:8080"

  redis:
    image: redis:8.8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Not reachable from the host on purpose -- only the app and kafka-ui, both inside this
      # compose network, ever talk to it, so there is no dual internal/external listener to keep
      # in sync.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: corebank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8080"

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  tempo:
    image: grafana/tempo:3.0.3
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      # Only for poking at the API directly from the host; Grafana and the containerized app
      # both reach Tempo over the compose network regardless of what's published here.
      - "3200:3200"
      - "4318:4318"

  grafana:
    image: grafana/grafana:13.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo
    ports:
      - "3000:3000"

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      # Local dev only: no TLS, no auth, security plugin off entirely. Matches this project's
      # existing local-dev posture (Grafana anonymous-admin, Keycloak default passwords) -- not
      # something to carry into any environment beyond a laptop.
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
      tempo:
        condition: service_started
      opensearch:
        condition: service_healthy
    environment:
      COREBANK_DB_URL: jdbc:postgresql://postgres:5432/corebank
      COREBANK_DB_USER: corebank
      COREBANK_DB_PASSWORD: ${POSTGRES_PASSWORD:-corebank}
      # issuer-uri is a logical value only -- it is compared as a string against each token's
      # `iss` claim and never dialed. jwk-set-uri is the one actually fetched, and must be
      # reachable from inside this container, hence the two different hostnames.
      COREBANK_OIDC_ISSUER_URI: http://localhost:8081/realms/corebank
      COREBANK_OIDC_JWK_SET_URI: http://keycloak:8080/realms/corebank/protocol/openid-connect/certs
      COREBANK_REDIS_HOST: redis
      COREBANK_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      COREBANK_ALLOWED_ORIGINS: ${COREBANK_ALLOWED_ORIGINS:-http://localhost:5173}
      COREBANK_OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      COREBANK_OPENSEARCH_URI: http://opensearch:9200
    ports:
      - "8080:8080"
      # gRPC. 9091 rather than 9090, which Prometheus already publishes above.
      - "9091:9091"

volumes:
  postgres-data:
